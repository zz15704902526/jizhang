<title>小窝记账 · 家庭收支预算台</title>
<style>
:root{
  --pink:#ff6b9d; --pink-d:#f2508c; --pink-l:#ffd6e7; --pink-bg:#fff5fa;
  --lav:#b8a4ff; --cream:#fffafd; --ink:#5a4150; --sub:#a98aa0; --line:#ffe1ee;
  --red:#ff5a7a; --green:#3ecf8e; --orange:#ffa94d; --blue:#6aa8ff;
  --shadow:0 6px 22px rgba(255,107,157,.12);
  --shadow-s:0 2px 10px rgba(255,107,157,.10);
  --r:20px; --r-s:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--pink-bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:15px}
input,select,textarea{font-family:inherit;font-size:16px;outline:none}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#ffc3da;border-radius:8px}

/* ===== layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:224px;flex:0 0 224px;background:linear-gradient(165deg,#ffb0d0 0%,#ff7eb0 45%,#c98bff 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px;gap:4px}
.side-logo{display:flex;align-items:center;gap:9px;padding:6px 10px 16px;font-weight:800;font-size:18px;letter-spacing:.5px;text-shadow:0 2px 6px rgba(180,40,110,.25)}
.side-logo svg{width:30px;height:30px;flex:0 0 30px}
.nav-item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:14px;color:rgba(255,255,255,.9);font-weight:600;font-size:15px;position:relative;cursor:pointer;transition:.18s;min-height:46px}
.nav-item svg{width:21px;height:21px;flex:0 0 21px}
.nav-item:hover{background:rgba(255,255,255,.16)}
.nav-item.active{background:#fff;color:var(--pink-d);box-shadow:0 6px 16px rgba(180,40,110,.22)}
.nav-item .lock{margin-left:auto;font-size:11px;opacity:.7}
.nav-sep{height:1px;background:rgba(255,255,255,.25);margin:10px 8px}
.nav-foot{margin-top:auto;font-size:11px;opacity:.8;padding:8px 12px;line-height:1.6}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--pink-bg)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,245,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:18px;margin:0;font-weight:800;flex:1;display:flex;align-items:center;gap:8px}
.topbar h1 small{font-size:12px;font-weight:500;color:var(--sub)}
.member-switch{display:flex;background:#ffe4f0;border-radius:20px;padding:3px}
.member-switch button{padding:6px 14px;border-radius:17px;font-weight:700;color:var(--pink-d);min-height:36px}
.member-switch button.on{background:#fff;box-shadow:var(--shadow-s)}
.tb-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;color:var(--pink-d);min-height:40px;box-shadow:var(--shadow-s)}
.tb-btn svg{width:17px;height:17px}
.tb-btn:active{transform:scale(.96)}

.content{flex:1;overflow-y:auto;padding:20px;max-width:1080px;width:100%;margin:0 auto}
.content.manage .card,.content.manage .nav-managedrag{outline:2px dashed var(--pink-l)}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;position:relative}
.card-h{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:16px;font-weight:800;color:var(--ink)}
.card-h svg{width:20px;height:20px;color:var(--pink)}
.card-h .sub{font-size:12px;color:var(--sub);font-weight:500;margin-left:4px}
.card-tools{margin-left:auto;display:flex;gap:6px;opacity:0;transition:.15s}
.card:hover .card-tools{opacity:1}
.card-tools button{width:30px;height:30px;border-radius:9px;background:#fff0f6;color:var(--pink-d);display:flex;align-items:center;justify-content:center}
.card-tools button svg{width:15px;height:15px}
.manage .card-tools{opacity:1}

/* ===== buttons / chips ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#ff8fc0,#ff6b9d);color:#fff;font-weight:700;border-radius:14px;padding:11px 18px;box-shadow:var(--shadow-s);min-height:44px;transition:.15s}
.btn svg{width:17px;height:17px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--pink-d);border:1px solid var(--line)}
.btn.soft{background:#ffe6f1;color:var(--pink-d)}
.btn.lav{background:linear-gradient(135deg,#c4adff,#a98bff)}
.btn.sm{padding:8px 13px;font-size:13px;min-height:38px;border-radius:11px}
.btn.danger{background:linear-gradient(135deg,#ff8aa0,#ff5a7a)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:20px;background:#fff0f6;color:var(--pink-d);font-weight:700;font-size:13px;min-height:36px;border:1px solid transparent}
.chip.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.chip .dot{width:9px;height:9px;border-radius:50%}

/* ===== forms ===== */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;color:var(--sub);font-weight:700;padding-left:2px}
.fld input,.fld select,.fld textarea{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);min-height:44px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pink);background:#fff}
.fld textarea{resize:vertical;min-height:60px}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:14px}.mb{margin-bottom:14px}

/* ===== stat ===== */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--cream);border-radius:var(--r-s);padding:14px;border:1px solid var(--line)}
.stat .k{font-size:12px;color:var(--sub);font-weight:700}
.stat .v{font-size:22px;font-weight:800;margin-top:3px}
.stat .v.red{color:var(--red)} .stat .v.green{color:var(--green)}
.stat .v.pink{color:var(--pink-d)}

/* ===== chart ===== */
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:160px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .li .dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px}
.legend .li .nm{flex:1;font-weight:700}
.legend .li .pc{color:var(--sub);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding:10px 2px 0;overflow-x:auto}
.bar-col{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bar-col .bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#ff9ec4,#ff6b9d);transition:.3s;min-height:3px}
.bar-col .bar.over{background:linear-gradient(180deg,#ff9aa9,#ff5a7a)}
.bar-col .lab{font-size:11px;color:var(--sub);font-weight:700}
.minibar{height:12px;border-radius:8px;background:#ffe4f0;overflow:hidden;position:relative}
.minibar > i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ffb0d0,#ff6b9d)}
.minibar > i.over{background:linear-gradient(90deg,#ff9aa9,#ff5a7a)}

/* ===== lists / tables ===== */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--line)}

/* ============ 计算 ============ */
function yExp(y){ return S.expenses.filter(function(e){return e.date&&e.date.indexOf(y)===0 && e.status!=='pending';}); }
function sumExp(y){ return yExp(y).reduce(function(s,e){return s+(+e.amount||0);},0); }
function catTotals(y){ var m={}; yExp(y).forEach(function(e){ m[e.category]=(m[e.category]||0)+(+e.amount||0); }); return m; }
function sumInc(y){ return S.incomes.filter(function(i){return i.date&&i.date.indexOf(y)===0;}).reduce(function(s,i){return s+(+i.amount||0);},0); }
function monthlyTotals(y){ var m=Array(12).fill(0); yExp(y).forEach(function(e){ var mo=parseInt(e.date.slice(5,7),10); if(mo>=1&&mo<=12) m[mo-1]+=(+e.amount||0); }); return m; }
function memFilter(arr){ if(!S.curMember||S.curMember==='全部') return arr; return arr.filter(function(x){return x.member===S.curMember;}); }

/* ============ 图表 ============ */
function donut(segs){
  var total=segs.reduce(function(s,x){return s+x.value;},0)||1;
  var r=52,c=2*Math.PI*r,off=0,rings='';
  segs.forEach(function(s){
    var len=s.value/total*c;
    rings+='<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="16" stroke-dasharray="'+len.toFixed(1)+' '+(c-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 70 70)"/>';
    off+=len;
  });
  return '<svg width="140" height="140" viewBox="0 0 140 140">'+rings+'<text x="70" y="65" text-anchor="middle" font-size="12" fill="#a98aa0">年支出</text><text x="70" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="#5a4150">'+money(total)+'</text></svg>';
}
function bars(monthly,overArr){
  var max=Math.max.apply(null,monthly.concat([1]));
  return '<div class="bars">'+monthly.map(function(v,i){
    var h=v>0?Math.round(v/max*118)+4:2; var ov=overArr&&overArr[i];
    return '<div class="bar-col"><div class="bar'+(ov?' over':'')+'" style="height:'+h+'px" title="'+(i+1)+'月 '+money(v)+'"></div><div class="lab">'+(i+1)+'</div></div>';
  }).join('')+'</div>';
}

function navItem(p,locked){
  var a=document.createElement('div'); a.className='nav-item'+(curPage===p.id?' active':'');
  var act=locked?(manage?'toggleExt':'nav'):'nav';
  a.setAttribute('data-act',act); a.setAttribute('data-id',p.id); a.setAttribute('draggable',(manage&&!locked)?'true':'false');

  if(locked) inner+='<span class="lock">待启用</span>';
  if(manage&&!locked) inner+='<button class="nav-hide" data-act="navHide" data-id="'+p.id+'" title="隐藏" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center">'+ic('x')+'</button>';

function expRow(e){
  return '<div class="lrow" data-act="expEdit" data-id="'+e.id+'">'
   +'<div class="ic" style="background:'+catColor(e.category)+'">'+esc((e.title||'花').slice(0,1))+'</div>'
   +'<div class="main"><div class="t">'+esc(e.title)+(e.status==='pending'?' <span class="pending-flag">待确认</span>':'')+'</div><div class="s">'+e.date+' · '+catName(e.category)+' · '+esc(e.pay)+(e.member&&e.member!=='我'?' · '+esc(e.member):'')+'</div></div>'
   +'<div class="amt exp">-'+money(e.amount)+'</div>'
   +'<div class="acts"><button data-act="expEdit" data-id="'+e.id+'" title="编辑">'+ic('edit')+'</button><button data-act="expDel" data-id="'+e.id+'" title="删除">'+ic('trash')+'</button></div>'
   +'</div>';

function genSummary(y){
  var inc=sumInc(y), exp=sumExp(y), ct=catTotals(y);
  var arr=CATS.filter(function(c){return ct[c.key]>0;}).sort(function(a,b){return ct[b.key]-ct[a.key];});
  var top=arr[0];
  var over=S.budget.cats.filter(function(c){return (ct[c.catKey]||0)>c.budget;});
  var p=[];
  p.push('今年已记录收入 '+money(inc)+'，支出 '+money(exp)+'，结余 '+money(inc-exp)+'，整体账目健康～');
  if(top) p.push('花得最多的是「'+top.name+'」，共 '+money(ct[top.key])+'，约占总收入的 '+Math.round(ct[top.key]/(inc||1)*100)+'%。');
  if(over.length) p.push('要留意：'+over.map(function(c){return '「'+c.name+'」已用 '+money(ct[c.catKey])+'，超预算 '+money(ct[c.catKey]-c.budget);}).join('；')+'。');
  else p.push('各重点类目预算都还在可控范围，棒棒哒！');
  var wei=S.expenses.filter(function(e){return e.note&&e.note.indexOf('伟伟')>=0;}).reduce(function(s,e){return s+(+e.amount||0);},0);
  if(wei) p.push('其中给伟伟的生活费已转 ' +money(wei)+'。');
  p.push('小建议：把高频小开销（外卖、奶茶）随手记，月底一眼看出哪里能省一点点～');
  return p.join('');
}
function pageOverview(){
  var y=S.year, inc=sumInc(y), exp=sumExp(y), bal=inc-exp;
  var ct=catTotals(y);
  var segs=CATS.filter(function(c){return ct[c.key]>0;}).map(function(c){return {name:c.name,value:ct[c.key],color:c.color};});
  var segsSorted=segs.slice().sort(function(a,b){return b.value-a.value;});
  var recent=yExp(y).slice().sort(function(a,b){return b.date>a.date?1:-1;}).slice(0,6);
  var budTotal=S.budget.total, used=exp, rem=budTotal-used, ratio=rem/budTotal;
  var mini=S.budget.cats.map(function(c){
    var b=c.budget, u=ct[c.catKey]||0, p=b>0?Math.min(100,Math.round(u/b*100)):0, ov=u>b;
    return '<div style="margin-bottom:10px"><div class="flex" style="font-size:13px;font-weight:700;margin-bottom:4px"><span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+c.color+';margin-right:6px;vertical-align:middle"></span>'+esc(c.name)+'</span><span class="dim">'+money(u)+' / '+money(b)+'</span></div><div class="minibar"><i class="'+(ov?'over':'')+'" style="width:'+p+'%"></i></div></div>';
  }).join('');
  return cardShell('ov1','wallet','年度收支概览','',
     '<div class="stat-row">'
     +stat('年度总收入','inc',money(inc))
     +stat('年度总支出','exp',money(exp))
     +stat('年度结余','green',money(bal))
     +stat('预算剩余','pink',money(rem)+(ratio<0.2?' <span class="pending-flag">偏低</span>':''))
     +'</div>')
   +cardShell('ov2','pie','花销分类占比','',
     '<div class="donut-wrap">'+donut(segs)+'<div class="legend">'+segsSorted.map(function(s){return '<div class="li"><span class="dot" style="background:'+s.color+'"></span><span class="nm">'+s.name+'</span><span class="pc">'+Math.round(s.value/(exp||1)*100)+'%</span></div>';}).join('')+'</div></div>')
   +cardShell('ov3','list','最近流水','', '<div class="list">'+(recent.length?recent.map(expRow).join(''):empty('还没有流水~'))+'</div>')
   +cardShell('ov4','chart','预算进度','', mini)
   +cardShell('ov5','bell','消费小结','', '<p style="line-height:1.8;margin:0;color:#6b5a63">'+genSummary(y)+'</p>');
}

/* ============ 花销流水 ============ */
function pageExpense(){
  var y=S.year;
  var list=memFilter(S.expenses).filter(function(e){return e.date&&e.date.indexOf(y)===0;});
  var pending=list.filter(function(e){return e.status==='pending';});
  var shown=list.filter(function(e){
    if(expTab==='all') return e.status!=='pending';
    if(expTab==='pending') return e.status==='pending';
    return e.category===expTab && e.status!=='pending';
  });
  shown=shown.slice().sort(function(a,b){return b.date>a.date?1:(b.date<a.date?-1:0);});
  var chips='<button class="chip'+(expTab==='all'?' on':'')+'" data-act="expTab" data-t="all">全部</button>';
  if(pending.length) chips+='<button class="chip'+(expTab==='pending'?' on':'')+'" data-act="expTab" data-t="pending">待确认 '+pending.length+'</button>';
  CATS.forEach(function(c){ var n=list.filter(function(e){return e.category===c.key&&e.status!=='pending';}).length; if(n) chips+='<button class="chip'+(expTab===c.key?' on':'')+'" data-act="expTab" data-t="'+c.key+'"><span class="dot" style="background:'+c.color+'"></span>'+c.name+'</button>'; });
  var rows=shown.map(expRow).join('');
  var mt=monthlyTotals(y); var base=S.budget.total/12; var overArr=mt.map(function(v){return v>base;});
  var totalExp=sumExp(y);
  return cardShell('exp1','plus','记一笔','',
     '<div class="flex"><button class="btn" data-act="expAdd">'+ic('plus')+' 快速记账</button><button class="btn soft" data-act="expBatch">'+ic('list')+' 批量录入</button></div>')
   +cardShell('exp2','wallet','年度支出合计', S.curMember==='我'?'':'（'+S.curMember+'）', '<div class="stat-row"><div class="stat"><div class="k">'+S.year+' 已支出</div><div class="v exp">'+money(totalExp)+'</div></div><div class="stat"><div class="k">记录笔数</div><div class="v pink">'+list.filter(function(e){return e.status!=='pending';}).length+' 笔</div></div></div>')
   +cardShell('exp3','chart','月度花销','超月均预算('+money(base)+')的月份标红', bars(mt,overArr))
   +cardShell('exp4','tag','筛选','', '<div class="flex" style="gap:7px">'+chips+'</div>')
   +cardShell('exp5','list','花销流水', S.curMember==='我'?'':'（'+S.curMember+'）', '<div class="list">'+(rows||empty('这个筛选下还没有记录~'))+'</div>');
}

function sumExpOfMonth(y,mm){ var s=0; yExp(y).forEach(function(e){ if(e.date.slice(5,7)===mm) s+=(+e.amount||0); }); return s; }
function pageBudget(){
  var y=S.year; var ct=catTotals(y); var exp=sumExp(y);
  var total=S.budget.total; var used=exp; var rem=total-used; var pct=total>0?Math.round(used/total*100):0; var ov=used>total;
  var totalCard='<div class="stat-row">'
    +stat('年度总预算','pink',money(total))
    +stat('已用金额',ov?'exp':'','-'+money(used))
    +stat('剩余金额',rem<0?'exp':'green',money(rem))
    +stat('剩余比例','pink',Math.round(rem/total*100)+'%')
    +'</div><div class="minibar mt" style="height:16px"><i class="'+(ov?'over':'')+'" style="width:'+pct+'%"></i></div>';
  var cc='';
  S.budget.cats.forEach(function(c){
    var b=c.budget, u=ct[c.catKey]||0, r=b-u, pp=b>0?Math.min(100,Math.round(u/b*100)):0, cov=u>b;
    cc+='<div class="bud-card'+(cov?' over':'')+'"><div class="bh"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+'</div><div class="nums"><span>预算 <b>'+money(b)+'</b></span><span>已用 <b>'+money(u)+'</b></span><span class="r'+(r<0?' neg':'')+'">剩余 '+money(r)+'</span><span>占用 '+pp+'%</span></div><div class="minibar mt"><i class="'+(cov?'over':'')+'" style="width:'+pp+'%"></i></div><div class="flex mt" style="gap:8px"><button class="btn sm soft" data-act="budCatEdit" data-id="'+c.id+'">'+ic('edit')+' 改额度</button><button class="btn sm ghost" data-act="budCatDel" data-id="'+c.id+'">'+ic('trash')+' 删除</button></div></div>';
  });
  if(!S.budget.cats.length) cc=empty('还没有设置重点类目预算，点右上角「＋添加类目」');
  var bud3tools='<button class="chip" data-act="budCatAdd">'+ic('plus')+' 添加类目</button>';
  return cardShell('bud1','wallet','年度预算总览','', totalCard+'<div class="flex mt"><button class="btn sm" data-act="budEdit">'+ic('edit')+' 设置总预算</button></div>')
   +cardShell('bud3','chart','重点类目预算','可编辑 · 可新增', '<div class="grid2">'+cc+'</div>', bud3tools);
}

/* ============ 种草 ============ */
function pageWish(){
  var html=cardShell('wish1','plus','添加种草','', '<div class="flex"><button class="btn" data-act="wishAdd">'+ic('plus')+' 添加想买</button></div>');
  WISH_CATS.forEach(function(cat){
    var arr=S.wish.filter(function(w){return w.cat===cat;}).sort(function(a,b){return a.priority-b.priority;});
    if(!arr.length) return;
    var items=arr.map(function(w){
      var pcls=w.priority===1?'p1':(w.priority===2?'p2':'p3'); var bought=w.status==='bought';
      return '<div class="wish-item'+(bought?' bought':'')+'" data-wid="'+w.id+'" draggable="'+(manage?'true':'false')+'">'
        +'<div class="grip" data-grip="1">'+ic('drag')+'</div>'
        +'<div class="info"><div class="nm">'+esc(w.name)+(bought?' <span class="pending-flag" style="background:#d9f5e8;color:#1f9d63">已买</span>':'')+'</div><div class="rs">'+esc(w.reason||'')+(w.member&&w.member!=='我'?' · '+esc(w.member):'')+'</div></div>'
        +'<div class="pr">'+money(w.price)+'</div>'
        +'<span class="prio '+pcls+'">P'+w.priority+'</span>'
        +'<div class="acts"><button data-act="wishBuy" data-id="'+w.id+'" class="'+(bought?'':'go')+'" title="'+(bought?'转回想买':'标记已买')+'">'+ic(bought?'refresh':'check')+'</button>'+(bought?'<button data-act="wishToExp" data-id="'+w.id+'" title="转入流水">'+ic('list')+'</button>':'')+'<button data-act="wishDel" data-id="'+w.id+'" title="删除">'+ic('trash')+'</button></div>'
        +'</div>';
    }).join('');
    html+=cardShell('wish_'+cat,'gift',cat+' <span class="dim" style="font-size:12px;font-weight:500">'+arr.length+' 件</span>','', '<div class="wish-group" data-cat="'+cat+'">'+items+'</div>');
  });
  if(!S.wish.length) html+=empty('还没有种草，点上方添加想买的东西吧~');
  return html;
}

function saveIncome(){
  var d=$('f_date').value, srcV=$('f_src').value.trim(), amt=parseFloat($('f_amt').value)||0, note=$('f_note').value.trim(), mem=$('f_mem').value;

  else S.incomes.push({id:uid(),date:d,source:srcV,desc:'',amount:amt,note:note,member:mem});
  save(); closeModal(); render(); toast('已保存～');
}

function download(filename,content,mime){
  try{
    var file=new File([content], filename, {type:mime||'application/octet-stream'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:filename}).catch(function(){});
      return;
    }
  }catch(e){}
  var b=new Blob([content],{type:mime||'text/plain'}); var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(u);document.body.removeChild(a);},1000);
}

}

/* ============ 拖拽排序 ============ */
function dndChildren(container){
  if(!container)return;
  container.querySelectorAll('[draggable="true"]').forEach(function(el){
    el.addEventListener('dragstart',function(e){ e.dataTransfer.setData('text/plain', el.getAttribute('data-id')||el.getAttribute('data-wid')); e.dataTransfer.effectAllowed='move'; });
  });
}
function enableDnD(container,type,cat){
  if(!container||container._dnd)return; container._dnd=true;
  container.addEventListener('dragover',function(e){ e.preventDefault(); var t=e.target.closest('[data-id],[data-wid]'); if(t)t.classList.add('drag-over'); });
  container.addEventListener('dragleave',function(e){ var t=e.target.closest('[data-id],[data-wid]'); if(t)t.classList.remove('drag-over'); });
  container.addEventListener('drop',function(e){
    e.preventDefault();
    var id=e.dataTransfer.getData('text/plain');
    var dragged=container.querySelector('[data-id="'+id+'"]')||container.querySelector('[data-wid="'+id+'"]');
    var after=e.target.closest('[data-id],[data-wid]');
    if(dragged&&after&&dragged!==after){ container.insertBefore(dragged, after.nextSibling); commitOrder(container,type,cat); }
    container.querySelectorAll('.drag-over').forEach(function(x){x.classList.remove('drag-over');});
  });
}
function commitOrder(container,type,cat){
  if(type==='nav'){
    var ids=[]; container.querySelectorAll('.nav-item').forEach(function(n){ var i=n.getAttribute('data-id'); if(PAGES.some(function(p){return p.id===i;})) ids.push(i); });
    S.navOrder=ids.concat(S.navOrder.filter(function(x){return ids.indexOf(x)<0;}));
    save(); renderShell();
  } else if(type==='wish'){
    var wids=[]; container.querySelectorAll('.wish-item').forEach(function(w){ wids.push(w.getAttribute('data-wid')); });
    wids.forEach(function(wid,idx){ var w=byId(S.wish,wid); if(w)w.priority=idx+1; });
    save(); render();
  }
}
function attachSortable(){
  var nav=$('nav'); enableDnD(nav,'nav'); dndChildren(nav);

function aiToggleVoice(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){ toast('当前浏览器不支持语音识别，请用文字～'); return; }
  if(window._aiRec && window._aiRec._on){ window._aiRec.r.stop(); return; }

  var r=new SR(); r.lang='zh-CN'; r.interimResults=false; r.maxAlternatives=1;

  r.onerror=function(){ toast('语音识别出错，换文字试试'); };

function callLLM(text,cb){
  var a=getAI();
  var url=a.base.replace(/\/+$/,'')+'/chat/completions';
  var body={model:a.model,temperature:0.2,messages:[{role:'system',content:AI_SYS},{role:'user',content:text}]};
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.key},body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(o){
      if(!o.ok){ cb(false,(o.j&&o.j.error&&o.j.error.message)||('HTTP '+o.r)); return; }
      var c=o.j.choices&&o.j.choices[0]&&o.j.choices[0].message&&o.j.choices[0].message.content;
      var arr=parseAIJSON(c);
      if(!arr){ cb(false,'AI 返回无法解析'); return; }
      cb(true,arr);
    })
    .catch(function(err){ cb(false,String(err&&err.message||err)); });
}
function parseAIJSON(s){
  if(!s) return null; s=s.trim();
  var m=s.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) s=m[1].trim();
  var i=s.indexOf('['), j=s.lastIndexOf(']');
  if(i>=0 && j>i){ try{ return JSON.parse(s.slice(i,j+1)); }catch(e){} }
  var k=s.indexOf('{'), l=s.lastIndexOf('}');
  if(k>=0 && l>k){ try{ return [JSON.parse(s.slice(k,l+1))]; }catch(e){} }
  return null;
}
function applyActions(arr){
  if(!arr||!arr.length){ aiSay('我没听懂要记什么，再说详细点嘛～ 比如「今天买菜花50」', 'bot'); return; }
  var done=[], n=0;
  arr.forEach(function(a){
    if(a.action==='chat'){ aiSay(a.text||'嗯嗯～', 'bot'); return; }
    if(a.action==='expense'){
      var cat='other';
      if(a.category){ var c=CATS.find(function(x){return x.name===a.category;}); if(c) cat=c.key; else cat=guessCat(a.title||a.category); }
      else cat=guessCat(a.title);
      S.expenses.push(mkExp(a.date||todayStr(), a.title||'对话记账', parseFloat(a.amount)||0, cat, a.pay||'微信', '', a.member||S.curMember, 'ok'));
      done.push('支出 '+money(parseFloat(a.amount)||0)+' · '+(a.title||'')+' ('+catName(cat)+')'); n++;
    } else if(a.action==='income'){
      S.incomes.push({id:uid(),date:a.date||todayStr(),source:a.title||'对话收入',desc:'',amount:parseFloat(a.amount)||0,note:'',member:a.member||S.curMember});
      done.push('收入 '+money(parseFloat(a.amount)||0)+' · '+(a.title||'')); n++;
    } else if(a.action==='wish'){
      S.wish.push({id:uid(),name:a.title||'想买的东西',cat:'其他',price:parseFloat(a.amount)||0,reason:a.reason||'',priority:3,status:'want',member:a.member||S.curMember,ts:Date.now()});
      done.push('种草 '+esc(a.title||'')+' '+money(parseFloat(a.amount)||0)); n++;
    }
  });
  if(n>0){ save(); render();
    aiSayHTML('<div style="white-space:pre-wrap">✅ 已帮你记好 '+n+' 笔：\n'+esc(done.join('\n'))+'</div>', 'bot');
    toast('小喵已记账 '+n+' 笔');
  } else if(!arr.some(function(a){ return a.action==='chat'; })){ aiSay('我没有识别到要记的内容，可以再具体一点哦～', 'bot'); }
}
function aiSayHTML(html,role){ var ms=$('aiMsgs'); if(!ms)return; var d=document.createElement('div'); d.className='ai-msg '+(role==='user'?'user':'bot'); d.innerHTML=html; ms.appendChild(d); ms.scrollTop=ms.scrollHeight; }
function localParse(text){
  var amt=text.match(/(\d+(?:\.\d+)?)\s*(?:元|块|块钱)?/); var amount=amt?parseFloat(amt[1]):0;
  var dm=text.match(/(\d{4}-\d{2}-\d{2})/); var date=dm?dm[1]:todayStr();
  var isInc=/收入|工资|到账|发薪|奖金|副业|赚|进账|薪水|入账/.test(text);
  var isWish=/想买|种草|想要|购物车|看中|心水/.test(text);
  var member=/伟伟/.test(text)?'伟伟':'我';
  if(isWish){
    var wm=(text.match(/买([一-龥]{1,12})/)||[])[1]||'想买的东西';
    var reason=text.replace(/想买|种草|想要|购物车|看中|心水|[\d.]+元?|块|[\d.]+/g,'').replace(/\s+/g,'').slice(0,20)||'对话添加';
    return [{action:'wish',date:date,title:wm,amount:amount,reason:reason,member:member}];
  }
  var cat=guessCat(text);
  var title=text.replace(/今天|昨天|刚才|[\d.]+元?|块|[\d]{4}-[\d]{2}-[\d]{2}|花|花掉|付了|花了|买|花销|支出|收入|工资|到账|伟伟|我|给/g,'').replace(/\s+/g,'').slice(0,20)||'对话记账';
  if(isInc) return [{action:'income',date:date,title:title,amount:amount,member:member}];
  return [{action:'expense',date:date,title:title,amount:amount,category:catName(cat),pay:'微信',member:member}];
}
function openAISettings(){
  var a=getAI();
  var presets=AI_PRESETS.map(function(p){ return '<button data-act="aiPreset" data-base="'+p.base+'" data-model="'+p.model+'" data-name="'+p.name+'">'+p.name+'</button>'; }).join('');
  openModal(wrapModal('AI 助手设置',
    '<div class="ai-presets">'+presets+'</div>'
    +'<div class="ai-set-row"><label>接口地址 Base URL</label><input id="ai_base" value="'+esc(a.base)+'"></div>'
    +'<div class="ai-set-row"><label>模型名 Model</label><input id="ai_model" value="'+esc(a.model)+'"></div>'
    +'<div class="ai-set-row"><label>API Key（仅存你本机，不上传）</label><input id="ai_key" type="password" placeholder="sk-..." value="'+esc(a.key)+'"></div>'
    +'<p class="dim" style="font-size:12px;margin:4px 2px 0">支持任意 OpenAI 兼容接口（DeepSeek / Kimi / 通义 / OpenAI 等）。密钥只存你手机本地。</p>'
    +'<div class="foot"><button class="btn ghost" data-act="closeModal">取消</button><button class="btn" data-act="saveAISet">保存</button></div>'));
}
function saveAISettings(){
  var a=getAI();
  a.base=$('ai_base').value.trim(); a.model=$('ai_model').value.trim(); a.key=$('ai_key').value.trim();
  save(); closeModal();
  aiSay(aiHasKey()?'已保存～现在我可以真正听懂你说话啦！试试「刚才买菜花了60」':'已保存，不过还没填 Key，现在仍用本地识别哦', 'bot');
  toast('AI 设置已保存');
}

/* ============ 自动备份 ============ */
function autoBackupNow(){
  var str=JSON.stringify(S);
  try{
    var file=new File([str], '家庭收支自动备份_'+todayStr()+'.json', {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:'家庭收支自动备份'}).catch(function(){});
    } else {
      var b=new Blob([str],{type:'application/json'}); var u=URL.createObjectURL(b); var a=document.createElement('a'); a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(u);document.body.removeChild(a);},1000);
    }
  }catch(e){}
  localStorage.setItem(K+'_auto', Date.now());
}
function maybeAutoBackup(){
  if(S.autoBackup===false) return;
  if(localStorage.getItem(K+'_ever')!=='1') return;
  var last=parseInt(localStorage.getItem(K+'_auto')||'0',10);
  if(Date.now()-last > 24*3600*1000){
    setTimeout(function(){
      if(confirm('自动备份：把最新数据存到手机「文件」？(每天一次，点取消则明天再问)')) autoBackupNow();
      else localStorage.setItem(K+'_auto', Date.now());
    }, 1800);
  }
}

/* ============ 初始化 ============ */
function init(){
  idbOpen(function(){
    if(load()){ afterLoad(); return; }
    idbGet(function(str){
      if(str){ try{ var o=JSON.parse(str); if(o&&o.incomes){ S=o; save(); afterLoad(); toast('已从浏览器数据库恢复数据'); return; } }catch(e){} }
      var lost=(localStorage.getItem(K+'_ever')==='1');
      S=seed(); save(); afterLoad();
      if(lost) showLossBanner(); else toast('首次打开，已生成示例数据');
    });
  });
}
function afterLoad(){
  migrateBudget(); migrateMembers();
  if(!S.navOrder) S.navOrder=['overview','income','expense','budget','wish'];
  if(!S.customPages) S.customPages=[];
  if(!S.enabledExt) S.enabledExt={};
  if(!S.navHidden) S.navHidden={};
  getAI(); if(S.autoBackup===undefined) S.autoBackup=true;
  save(); render();
  maybeAutoBackup();
}
function showLossBanner(){
  var el=document.getElementById('lossBanner'); if(!el)return;
  el.hidden=false;
  var x=el.querySelector('.lb-x'); if(x) x.onclick=function(){ el.hidden=true; };
}

/* ===== iOS 添加到主屏幕引导 ===== */
function setupIosTip(){
  var ua=navigator.userAgent;
  var isIOS=/iP(hone|ad|od)/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!isIOS) return;
  if(localStorage.getItem('wb_ios_tip_dismissed')==='1') return;
  var el=document.getElementById('iostip'); if(el) el.hidden=false;
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  if(t.getAttribute('data-act')==='iosTipClose'){
    var el=document.getElementById('iostip'); if(el) el.hidden=true;
    localStorage.setItem('wb_ios_tip_dismissed','1');
  }
});

setupIosTip();
init();
</script>
